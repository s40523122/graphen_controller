controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ti5_left_leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ti5_right_leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ti5_waist_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ti5_left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ti5_right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ti5_neck_controller:
      type: joint_trajectory_controller/JointTrajectoryController

ti5_left_leg_controller:
  ros__parameters:
    joints:
      - L_HIP_P
      - L_HIP_R
      - L_HIP_Y
      - L_KNEE_P
      - L_ANKLE_P
      - L_ANKLE_R
    interface_name:
      - position
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true


ti5_right_leg_controller:
  ros__parameters:
    joints:
      - R_HIP_P
      - R_HIP_R
      - R_HIP_Y
      - R_KNEE_P
      - R_ANKLE_P
      - R_ANKLE_R
    interface_name:
      - position
    command_interfaces:
      - position
    state_interfaces:
