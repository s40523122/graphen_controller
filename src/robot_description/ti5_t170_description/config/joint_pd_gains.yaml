# T170-V2.1-A0（robot:=ti5_t170）的 PD 預設增益與力矩上限，以關節為 key，不綁定 controller 名稱。
# graphen 的 PdController（hardware:=mujoco_pd / real_pd）依自己的 joints 讀取 joint_gains.<joint>.*；
# 只在沒有指定增益的模式（target、bvh、hold）使用，RL policy 會指定自己的增益。
# 數值為實機 PD 的訓練值（graphen_rl_policy/ref/env.yaml 的 actuators），力矩上限與 MJCF 的 ctrlrange 相同。
# 與 param.csv（tc_new_025 的 actuators）不同；param.csv 是 MJCF 產生器的輸入，不要互相覆蓋。
# TODO(verify-on-hw): 增益與力矩換算尚未在實機驗證，首次測試請吊掛並降低增益
