# use_mock_imu:=true（hardware:=mock / real）：mock IMU（MockImu）的模擬資料寫入。
# /sensor_forwarder/commands（Float64MultiArray）的 10 個值依 interface_names 的順序寫入 imu_sensor/*

controller_manager:
  ros__parameters:
    sensor_forwarder:
      type: forward_command_controller/MultiInterfaceForwardCommandController

sensor_forwarder:
  ros__parameters:
    joint: imu_sensor
    interface_names:
      - orientation.x
      - orientation.y
      - orientation.z
      - orientation.w
      - angular_velocity.x
      - angular_velocity.y
      - angular_velocity.z
      - linear_acceleration.x
      - linear_acceleration.y
      - linear_acceleration.z
