# hardware:=mujoco_pd mujoco_robot:=t170a 的子群組預設增益與力矩上限。
# 增益為 t170a 的訓練值（graphen_rl_policy/ref/env.yaml 的 actuators）；fb70 的增益套在較輕的 t170a 上
# 會振盪（顯式 PD 的 kd·dt / I 約大於 2）。力矩上限與 t170a MJCF 的 ctrlrange 相同。
# 頸部在 t170a 中是虛擬關節，值不影響模擬

left_arm_group_controller:
  ros__parameters:
    default_kp: [60.0, 60.0, 40.0, 40.0, 20.0, 10.0, 10.0]
    default_kd: [2.0, 2.0, 1.5, 1.5, 1.0, 0.5, 0.5]
    effort_limits: [63.0, 63.0, 42.0, 42.0, 23.0, 8.3, 8.3]

right_arm_group_controller:
  ros__parameters:
    default_kp: [60.0, 60.0, 40.0, 40.0, 20.0, 10.0, 10.0]
    default_kd: [2.0, 2.0, 1.5, 1.5, 1.0, 0.5, 0.5]
    effort_limits: [63.0, 63.0, 42.0, 42.0, 23.0, 8.3, 8.3]

waist_group_controller:
  ros__parameters:
    default_kp: [300.0, 300.0, 300.0]
    default_kd: [6.0, 6.0, 6.0]
    effort_limits: [63.0, 63.0, 63.0]

head_group_controller:
  ros__parameters:
    default_kp: [20.0, 20.0, 20.0]
    default_kd: [1.0, 1.0, 1.0]
    effort_limits: [8.3, 2.3, 2.3]

left_leg_group_controller:
  ros__parameters:
    default_kp: [200.0, 150.0, 150.0, 200.0, 60.0, 30.0]
    default_kd: [5.0, 4.0, 4.0, 5.0, 2.0, 1.5]
    effort_limits: [267.0, 63.0, 121.0, 267.0, 63.0, 23.0]

right_leg_group_controller:
  ros__parameters:
    default_kp: [200.0, 150.0, 150.0, 200.0, 60.0, 30.0]
    default_kd: [5.0, 4.0, 4.0, 5.0, 2.0, 1.5]
    effort_limits: [267.0, 63.0, 121.0, 267.0, 63.0, 23.0]
