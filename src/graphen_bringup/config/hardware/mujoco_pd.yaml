# hardware:=mujoco_pd：graphen_mujoco/MujocoSystem 的力矩致動器 + PdController
# （τ = kp·(q* − q) + kd·(q̇* − q̇)，寫入 effort）。switch_group_controller 額外寫出速度前饋與 kp / kd，
# 讓 plugin 模式（RL policy）指定自己的增益；沒有指定增益的模式（target、bvh、hold）用預設增益。
# 預設增益與力矩上限依模型放在 mujoco_pd_<mujoco_robot>.yaml（launch 疊加在這個檔案之後）。
# IMU 由 MujocoSystem 提供，不使用 sensor_forwarder。
# TODO(verify-on-hw): 只用於 MuJoCo；Ti5 實機沒有 effort 介面

controller_manager:
  ros__parameters:
    # 訓練時 PD 以 200 Hz（物理步長 5 ms）執行，PD 迴圈需要相同的頻率
    update_rate: 200

    left_arm_group_controller:
      type: graphen_control/PdController

    right_arm_group_controller:
      type: graphen_control/PdController

    waist_group_controller:
      type: graphen_control/PdController

    head_group_controller:
      type: graphen_control/PdController

    left_leg_group_controller:
      type: graphen_control/PdController

    right_leg_group_controller:
      type: graphen_control/PdController

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

switch_group_controller:
  ros__parameters:
    # 與 command_interfaces 一一對應
    velocity_command_interfaces:
      - left_arm_group_controller/L_SHOULDER_P/velocity
      - left_arm_group_controller/L_SHOULDER_R/velocity
      - left_arm_group_controller/L_SHOULDER_Y/velocity
      - left_arm_group_controller/L_ELBOW_Y/velocity
      - left_arm_group_controller/L_WRIST_P/velocity
      - left_arm_group_controller/L_WRIST_Y/velocity
      - left_arm_group_controller/L_WRIST_R/velocity
      - right_arm_group_controller/R_SHOULDER_P/velocity
      - right_arm_group_controller/R_SHOULDER_R/velocity
      - right_arm_group_controller/R_SHOULDER_Y/velocity
      - right_arm_group_controller/R_ELBOW_Y/velocity
      - right_arm_group_controller/R_WRIST_P/velocity
      - right_arm_group_controller/R_WRIST_Y/velocity
      - right_arm_group_controller/R_WRIST_R/velocity
      - waist_group_controller/WAIST_Y/velocity
      - waist_group_controller/WAIST_R/velocity
      - waist_group_controller/WAIST_P/velocity
      - head_group_controller/NECK_Y/velocity
      - head_group_controller/NECK_P/velocity
      - head_group_controller/NECK_R/velocity
      - left_leg_group_controller/L_HIP_P/velocity
      - left_leg_group_controller/L_HIP_R/velocity
      - left_leg_group_controller/L_HIP_Y/velocity
      - left_leg_group_controller/L_KNEE_P/velocity
      - left_leg_group_controller/L_ANKLE_P/velocity
      - left_leg_group_controller/L_ANKLE_R/velocity
      - right_leg_group_controller/R_HIP_P/velocity
      - right_leg_group_controller/R_HIP_R/velocity
      - right_leg_group_controller/R_HIP_Y/velocity
      - right_leg_group_controller/R_KNEE_P/velocity
      - right_leg_group_controller/R_ANKLE_P/velocity
      - right_leg_group_controller/R_ANKLE_R/velocity
    kp_command_interfaces:
      - left_arm_group_controller/L_SHOULDER_P/kp
      - left_arm_group_controller/L_SHOULDER_R/kp
      - left_arm_group_controller/L_SHOULDER_Y/kp
      - left_arm_group_controller/L_ELBOW_Y/kp
      - left_arm_group_controller/L_WRIST_P/kp
      - left_arm_group_controller/L_WRIST_Y/kp
      - left_arm_group_controller/L_WRIST_R/kp
      - right_arm_group_controller/R_SHOULDER_P/kp
      - right_arm_group_controller/R_SHOULDER_R/kp
      - right_arm_group_controller/R_SHOULDER_Y/kp
      - right_arm_group_controller/R_ELBOW_Y/kp
      - right_arm_group_controller/R_WRIST_P/kp
      - right_arm_group_controller/R_WRIST_Y/kp
      - right_arm_group_controller/R_WRIST_R/kp
      - waist_group_controller/WAIST_Y/kp
      - waist_group_controller/WAIST_R/kp
      - waist_group_controller/WAIST_P/kp
      - head_group_controller/NECK_Y/kp
      - head_group_controller/NECK_P/kp
      - head_group_controller/NECK_R/kp
      - left_leg_group_controller/L_HIP_P/kp
      - left_leg_group_controller/L_HIP_R/kp
      - left_leg_group_controller/L_HIP_Y/kp
      - left_leg_group_controller/L_KNEE_P/kp
      - left_leg_group_controller/L_ANKLE_P/kp
      - left_leg_group_controller/L_ANKLE_R/kp
      - right_leg_group_controller/R_HIP_P/kp
      - right_leg_group_controller/R_HIP_R/kp
      - right_leg_group_controller/R_HIP_Y/kp
      - right_leg_group_controller/R_KNEE_P/kp
      - right_leg_group_controller/R_ANKLE_P/kp
      - right_leg_group_controller/R_ANKLE_R/kp
    kd_command_interfaces:
      - left_arm_group_controller/L_SHOULDER_P/kd
      - left_arm_group_controller/L_SHOULDER_R/kd
      - left_arm_group_controller/L_SHOULDER_Y/kd
      - left_arm_group_controller/L_ELBOW_Y/kd
      - left_arm_group_controller/L_WRIST_P/kd
      - left_arm_group_controller/L_WRIST_Y/kd
      - left_arm_group_controller/L_WRIST_R/kd
      - right_arm_group_controller/R_SHOULDER_P/kd
      - right_arm_group_controller/R_SHOULDER_R/kd
      - right_arm_group_controller/R_SHOULDER_Y/kd
      - right_arm_group_controller/R_ELBOW_Y/kd
      - right_arm_group_controller/R_WRIST_P/kd
      - right_arm_group_controller/R_WRIST_Y/kd
      - right_arm_group_controller/R_WRIST_R/kd
      - waist_group_controller/WAIST_Y/kd
      - waist_group_controller/WAIST_R/kd
      - waist_group_controller/WAIST_P/kd
      - head_group_controller/NECK_Y/kd
      - head_group_controller/NECK_P/kd
      - head_group_controller/NECK_R/kd
      - left_leg_group_controller/L_HIP_P/kd
      - left_leg_group_controller/L_HIP_R/kd
      - left_leg_group_controller/L_HIP_Y/kd
      - left_leg_group_controller/L_KNEE_P/kd
      - left_leg_group_controller/L_ANKLE_P/kd
      - left_leg_group_controller/L_ANKLE_R/kd
      - right_leg_group_controller/R_HIP_P/kd
      - right_leg_group_controller/R_HIP_R/kd
      - right_leg_group_controller/R_HIP_Y/kd
      - right_leg_group_controller/R_KNEE_P/kd
      - right_leg_group_controller/R_ANKLE_P/kd
      - right_leg_group_controller/R_ANKLE_R/kd

left_arm_group_controller:
  ros__parameters:
    joints: [L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y, L_ELBOW_Y, L_WRIST_P, L_WRIST_Y, L_WRIST_R]

right_arm_group_controller:
  ros__parameters:
    joints: [R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y, R_ELBOW_Y, R_WRIST_P, R_WRIST_Y, R_WRIST_R]

waist_group_controller:
  ros__parameters:
    joints: [WAIST_Y, WAIST_R, WAIST_P]

head_group_controller:
  ros__parameters:
    joints: [NECK_Y, NECK_P, NECK_R]

left_leg_group_controller:
  ros__parameters:
    joints: [L_HIP_P, L_HIP_R, L_HIP_Y, L_KNEE_P, L_ANKLE_P, L_ANKLE_R]

right_leg_group_controller:
  ros__parameters:
    joints: [R_HIP_P, R_HIP_R, R_HIP_Y, R_KNEE_P, R_ANKLE_P, R_ANKLE_R]

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
    # 模擬值沒有雜訊，給很小的變異數；姿態為世界座標系下的 imu_link 姿態（MuJoCo framequat）
    static_covariance_orientation: [1.0e-6, 0.0, 0.0, 0.0, 1.0e-6, 0.0, 0.0, 0.0, 1.0e-6]
    static_covariance_angular_velocity: [1.0e-6, 0.0, 0.0, 0.0, 1.0e-6, 0.0, 0.0, 0.0, 1.0e-6]
    static_covariance_linear_acceleration: [1.0e-4, 0.0, 0.0, 0.0, 1.0e-4, 0.0, 0.0, 0.0, 1.0e-4]
