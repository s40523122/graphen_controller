# hardware:=mujoco_pd mujoco_robot:=fb70 的子群組預設增益與力矩上限。
# 取自 graphen_mujoco/models 的 MJCF 位置致動器（FullBodyT70 的訓練值），
# 沒有指定增益的模式（target、bvh、hold）行為與 hardware:=mujoco 相同。
# 增益要配合模型的慣量：顯式 PD 的 kd·dt / I 約大於 2 時會振盪，不要套用到其他模型

left_arm_group_controller:
  ros__parameters:
    default_kp: [78.9568, 78.9568, 78.9568, 78.9568, 19.7392, 19.7392, 19.7392]
    default_kd: [5.02655, 5.02655, 5.02655, 5.02655, 1.25664, 1.25664, 1.25664]
    effort_limits: [63.0, 63.0, 42.0, 42.0, 23.0, 8.3, 8.3]

right_arm_group_controller:
  ros__parameters:
    default_kp: [78.9568, 78.9568, 78.9568, 78.9568, 19.7392, 19.7392, 19.7392]
    default_kd: [5.02655, 5.02655, 5.02655, 5.02655, 1.25664, 1.25664, 1.25664]
    effort_limits: [63.0, 63.0, 42.0, 42.0, 23.0, 8.3, 8.3]

waist_group_controller:
  ros__parameters:
    default_kp: [236.871, 236.871, 236.871]
    default_kd: [15.0796, 15.0796, 15.0796]
    effort_limits: [63.0, 63.0, 63.0]

head_group_controller:
  ros__parameters:
    default_kp: [39.4784, 39.4784, 39.4784]
    default_kd: [2.51327, 2.51327, 2.51327]
    effort_limits: [8.3, 2.3, 2.3]

left_leg_group_controller:
  ros__parameters:
    default_kp: [986.96, 236.871, 473.741, 986.96, 236.871, 78.9568]
    default_kd: [62.8319, 15.0796, 30.1593, 62.8319, 15.0796, 5.02655]
    effort_limits: [267.0, 63.0, 121.0, 267.0, 63.0, 23.0]

right_leg_group_controller:
  ros__parameters:
    default_kp: [986.96, 236.871, 473.741, 986.96, 236.871, 78.9568]
    default_kd: [62.8319, 15.0796, 30.1593, 62.8319, 15.0796, 5.02655]
    effort_limits: [267.0, 63.0, 121.0, 267.0, 63.0, 23.0]
