# hardware:=mujoco：graphen_mujoco/MujocoSystem 的位置致動器（MJCF 的 PD 增益），PositionController。
# IMU 由 MujocoSystem 提供（imu_sensor/*，介面與實機相同），不使用 sensor_forwarder。
# 只支援有位置伺服的模型（mujoco_robot:=fb70）

controller_manager:
  ros__parameters:
    update_rate: 100   # 物理 200 Hz，每個 controller 週期推進 2 步

    # T170 本體 32 軸，依部位分成 6 個子群組（分組參考 ti5_170a_graphen.srdf）
    left_arm_group_controller:
      type: graphen_control/PositionController

    right_arm_group_controller:
      type: graphen_control/PositionController

    waist_group_controller:
      type: graphen_control/PositionController

    head_group_controller:
      type: graphen_control/PositionController

    left_leg_group_controller:
      type: graphen_control/PositionController

    right_leg_group_controller:
      type: graphen_control/PositionController

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

# 位置模式：reference 插補後寫到硬體的 <joint>/position，input 與 output 1:1
left_arm_group_controller:
  ros__parameters:
    input_interfaces: [L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y, L_ELBOW_Y, L_WRIST_P, L_WRIST_Y, L_WRIST_R]
    output_interfaces:
      - L_SHOULDER_P/position
      - L_SHOULDER_R/position
      - L_SHOULDER_Y/position
      - L_ELBOW_Y/position
      - L_WRIST_P/position
      - L_WRIST_Y/position
      - L_WRIST_R/position

right_arm_group_controller:
  ros__parameters:
    input_interfaces: [R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y, R_ELBOW_Y, R_WRIST_P, R_WRIST_Y, R_WRIST_R]
    output_interfaces:
      - R_SHOULDER_P/position
      - R_SHOULDER_R/position
      - R_SHOULDER_Y/position
      - R_ELBOW_Y/position
      - R_WRIST_P/position
      - R_WRIST_Y/position
      - R_WRIST_R/position

waist_group_controller:
  ros__parameters:
    input_interfaces: [WAIST_Y, WAIST_R, WAIST_P]
    output_interfaces:
      - WAIST_Y/position
      - WAIST_R/position
      - WAIST_P/position

head_group_controller:
  ros__parameters:
    input_interfaces: [NECK_Y, NECK_P, NECK_R]
    output_interfaces:
      - NECK_Y/position
      - NECK_P/position
      - NECK_R/position

left_leg_group_controller:
  ros__parameters:
    input_interfaces: [L_HIP_P, L_HIP_R, L_HIP_Y, L_KNEE_P, L_ANKLE_P, L_ANKLE_R]
    output_interfaces:
      - L_HIP_P/position
      - L_HIP_R/position
      - L_HIP_Y/position
      - L_KNEE_P/position
      - L_ANKLE_P/position
      - L_ANKLE_R/position

right_leg_group_controller:
  ros__parameters:
    input_interfaces: [R_HIP_P, R_HIP_R, R_HIP_Y, R_KNEE_P, R_ANKLE_P, R_ANKLE_R]
    output_interfaces:
      - R_HIP_P/position
      - R_HIP_R/position
      - R_HIP_Y/position
      - R_KNEE_P/position
      - R_ANKLE_P/position
      - R_ANKLE_R/position

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
    # 模擬值沒有雜訊，給很小的變異數；姿態為世界座標系下的 imu_link 姿態（MuJoCo framequat）
    static_covariance_orientation: [1.0e-6, 0.0, 0.0, 0.0, 1.0e-6, 0.0, 0.0, 0.0, 1.0e-6]
    static_covariance_angular_velocity: [1.0e-6, 0.0, 0.0, 0.0, 1.0e-6, 0.0, 0.0, 0.0, 1.0e-6]
    static_covariance_linear_acceleration: [1.0e-4, 0.0, 0.0, 0.0, 1.0e-4, 0.0, 0.0, 0.0, 1.0e-4]
