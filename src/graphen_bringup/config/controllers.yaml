controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_group_controller:
      type: graphen_control/SubGroupController

    gripper_group_controller:
      type: graphen_control/SubGroupController

    switch_group_controller:
      type: graphen_control/SwitchGroupController

    sensor_forwarder:
      type: forward_command_controller/ForwardCommandController

sensor_forwarder:
  ros__parameters:
    joints:
      - imu
    interface_name: raw_data

switch_group_controller:
  ros__parameters:
    sensor: imu/raw_data
    state_publish_rate: 50.0
    state_interfaces:
      - joint_arm1/position
      - joint_gripper1/position
    command_interfaces:
      - arm_group_controller/position
      - gripper_group_controller/position
    # 模式以名稱識別（BT、action、~/mode topic 都用這些名稱），名稱同時是下面參數的前綴。
    # forward 往正方向（正轉）、reverse 往負方向（反轉）。
    # BT 以遲滯門檻換向時，門檻必須落在兩個模式的 arm 目標之間（目前 BT 用 ±1.0）
    modes: [forward, reverse]
    default_mode: forward
    forward:
      targets: [ 1.5, 0.05]   # 依 command_interfaces 順序：arm, gripper
    reverse:
      targets: [-1.5, 0.05]
    # planner 以 planner_rate 往模式目標內插，每週期最多移動 planner_max_steps
    planner_rate: 100.0
    planner_max_steps: [0.005, 0.001]   # 100 Hz 下 arm 約 0.5 rad/s、gripper 約 0.1 m/s
    # activate 時以這些 state 作為 planner 起點（順序對應 command_interfaces）
    target_state_interfaces:
      - joint_arm1/position
      - joint_gripper1/position

arm_group_controller:
  ros__parameters:
    input_interfaces:
      - position
    output_interfaces:
      - joint_arm1/position
    reference_publish_rate: 50.0

gripper_group_controller:
  ros__parameters:
    input_interfaces:
      - position
    output_interfaces:
      - joint_gripper1/position
    reference_publish_rate: 50.0
