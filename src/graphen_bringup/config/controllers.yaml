controller_manager:
  ros__parameters:
    update_rate: 100   # 實機 CAN 讀取有 timeout，不使用過高的頻率

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # T170 本體 32 軸，依部位分成 6 個子群組（分組參考 ti5_170a_graphen.srdf）
    left_arm_group_controller:
      type: graphen_control/SubGroupController

    right_arm_group_controller:
      type: graphen_control/SubGroupController

    waist_group_controller:
      type: graphen_control/SubGroupController

    head_group_controller:
      type: graphen_control/SubGroupController

    left_leg_group_controller:
      type: graphen_control/SubGroupController

    right_leg_group_controller:
      type: graphen_control/SubGroupController

    switch_group_controller:
      type: graphen_control/SwitchGroupController

    sensor_forwarder:
      type: forward_command_controller/ForwardCommandController

sensor_forwarder:
  ros__parameters:
    joints:
      - imu
    interface_name: raw_data

switch_group_controller:
  ros__parameters:
    sensor: imu/raw_data
    state_publish_rate: 50.0
    state_interfaces:
      - L_SHOULDER_P/position
      - L_SHOULDER_R/position
      - L_SHOULDER_Y/position
      - L_ELBOW_Y/position
      - L_WRIST_P/position
      - L_WRIST_Y/position
      - L_WRIST_R/position
      - R_SHOULDER_P/position
      - R_SHOULDER_R/position
      - R_SHOULDER_Y/position
      - R_ELBOW_Y/position
      - R_WRIST_P/position
      - R_WRIST_Y/position
      - R_WRIST_R/position
      - WAIST_Y/position
      - WAIST_R/position
      - WAIST_P/position
      - NECK_Y/position
      - NECK_P/position
      - NECK_R/position
      - L_HIP_P/position
      - L_HIP_R/position
      - L_HIP_Y/position
      - L_KNEE_P/position
      - L_ANKLE_P/position
      - L_ANKLE_R/position
      - R_HIP_P/position
      - R_HIP_R/position
      - R_HIP_Y/position
      - R_KNEE_P/position
      - R_ANKLE_P/position
      - R_ANKLE_R/position
    # 下游 reference interface，順序對應 target_state_interfaces、planner_max_steps 與各模式的 max_steps
    command_interfaces:
      - left_arm_group_controller/L_SHOULDER_P
      - left_arm_group_controller/L_SHOULDER_R
      - left_arm_group_controller/L_SHOULDER_Y
      - left_arm_group_controller/L_ELBOW_Y
      - left_arm_group_controller/L_WRIST_P
      - left_arm_group_controller/L_WRIST_Y
      - left_arm_group_controller/L_WRIST_R
      - right_arm_group_controller/R_SHOULDER_P
      - right_arm_group_controller/R_SHOULDER_R
      - right_arm_group_controller/R_SHOULDER_Y
      - right_arm_group_controller/R_ELBOW_Y
      - right_arm_group_controller/R_WRIST_P
      - right_arm_group_controller/R_WRIST_Y
      - right_arm_group_controller/R_WRIST_R
      - waist_group_controller/WAIST_Y
      - waist_group_controller/WAIST_R
      - waist_group_controller/WAIST_P
      - head_group_controller/NECK_Y
      - head_group_controller/NECK_P
      - head_group_controller/NECK_R
      - left_leg_group_controller/L_HIP_P
      - left_leg_group_controller/L_HIP_R
      - left_leg_group_controller/L_HIP_Y
      - left_leg_group_controller/L_KNEE_P
      - left_leg_group_controller/L_ANKLE_P
      - left_leg_group_controller/L_ANKLE_R
      - right_leg_group_controller/R_HIP_P
      - right_leg_group_controller/R_HIP_R
      - right_leg_group_controller/R_HIP_Y
      - right_leg_group_controller/R_KNEE_P
      - right_leg_group_controller/R_ANKLE_P
      - right_leg_group_controller/R_ANKLE_R
    # 每週期寫入目前模式的輸出點間隔（BVH 播放時為 frame_time / time_scale，其他為 0），
    # 子群組依此在 RT 迴圈中插補；只是接線設定，換 BVH 不需要修改
    sample_period_interfaces:
      - left_arm_group_controller/sample_period
      - right_arm_group_controller/sample_period
      - waist_group_controller/sample_period
      - head_group_controller/sample_period
      - left_leg_group_controller/sample_period
      - right_leg_group_controller/sample_period
    # activate 時以這些 state 作為 planner 起點；prefix 即為 joint 名稱（模式的 joints、BVH 對應都用它）
    target_state_interfaces:
      - L_SHOULDER_P/position
      - L_SHOULDER_R/position
      - L_SHOULDER_Y/position
      - L_ELBOW_Y/position
      - L_WRIST_P/position
      - L_WRIST_Y/position
      - L_WRIST_R/position
      - R_SHOULDER_P/position
      - R_SHOULDER_R/position
      - R_SHOULDER_Y/position
      - R_ELBOW_Y/position
      - R_WRIST_P/position
      - R_WRIST_Y/position
      - R_WRIST_R/position
      - WAIST_Y/position
      - WAIST_R/position
      - WAIST_P/position
      - NECK_Y/position
      - NECK_P/position
      - NECK_R/position
      - L_HIP_P/position
      - L_HIP_R/position
      - L_HIP_Y/position
      - L_KNEE_P/position
      - L_ANKLE_P/position
      - L_ANKLE_R/position
      - R_HIP_P/position
      - R_HIP_R/position
      - R_HIP_Y/position
      - R_KNEE_P/position
      - R_ANKLE_P/position
      - R_ANKLE_R/position

    # planner 以 planner_rate 播放目前模式，每週期最多移動 max_steps（各模式未指定時用 planner_max_steps）
    planner_rate: 100.0
    planner_max_steps: [0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005,   # left arm
                        0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005,   # right arm
                        0.005, 0.005, 0.005,                               # waist
                        0.005, 0.005, 0.005,                               # head
                        0.005, 0.005, 0.005, 0.005, 0.005, 0.005,          # left leg
                        0.005, 0.005, 0.005, 0.005, 0.005, 0.005]          # right leg
    # 100 Hz 下約 0.5 rad/s

    # 模式以名稱識別（BT、action、~/mode topic 都用這些名稱），名稱同時是下面參數的前綴。
    # controller 不認得任何特定模式，行為完全由 type 與參數決定
    modes: [forward, reverse, walk]
    # 空字串：啟動時不進入任何模式，保持目前位置（實機為 real_initial_positions 或開機位置），
    # 收到 BT / action / ~/mode 的命令後才開始移動
    default_mode: ""

    # type: target，只列出要動的 joint，其餘保持進入模式時的位置。
    # forward 往正方向、reverse 往負方向；BT（joint_reciprocate）以遲滯門檻換向時，
    # 門檻必須落在兩個模式的 L_WRIST_P 目標之間（目前 BT 用 ±1.0）
    forward:
      type: target
      joints: [L_WRIST_P, R_WRIST_P]
      targets: [1.5, 1.5]
    reverse:
      type: target
      joints: [L_WRIST_P, R_WRIST_P]
      targets: [-1.5, -1.5]

    # type: bvh，在 planner thread 中把 BVH 轉成 32 軸位置，依檔案頻率輸出原始幀，
    # 幀間插補由子群組依 sample_period 進行（約晚一幀）。
    # 先以 approach_max_steps（預設 planner_max_steps）走向第 0 幀，再以 max_steps 為上限播放。
    # 一幀會一次跳到位，max_steps 要讓一個週期就能走完一幀：依 bvh_retarget_cli 的步行段最大速度
    # × frame_time（1/24 s）× 1.2 設定；它同時擋下肩部 T-pose 奇異點附近的大跳動。
    # 實機的 Ti5Hardware 另以 max_command_velocity 限速
    walk:
      type: bvh
      file: package://graphen_bringup/motions/t170wk_walk1_subject1.bvh
      loop: true
      time_scale: 1.0
      max_steps: [0.34, 0.15, 0.31, 0.34, 0.07, 0.38, 0.32,   # left arm
                  0.34, 0.15, 0.31, 0.34, 0.07, 0.38, 0.32,   # right arm
                  0.03, 0.03, 0.03,                           # waist
                  0.21, 0.16, 0.25,                           # head
                  0.28, 0.13, 0.24, 0.67, 0.24, 0.44,         # left leg
                  0.28, 0.13, 0.24, 0.67, 0.24, 0.44]         # right leg

    # BVH 轉換：BVH 節點名稱 = URDF link 名稱，姿態以 base_link 為基準（BVH 的浮動基座會被忽略）
    bvh:
      base_link: BASE_S
      axis_tolerance: 1.0e-4       # 判斷軸線交於一點的距離容差（m）
      max_iterations: 50
      damping: 1.0e-6
      residual_tolerance: 1.0e-3   # rad

left_arm_group_controller:
  ros__parameters:
    input_interfaces: [L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y, L_ELBOW_Y, L_WRIST_P, L_WRIST_Y, L_WRIST_R]
    output_interfaces:
      - L_SHOULDER_P/position
      - L_SHOULDER_R/position
      - L_SHOULDER_Y/position
      - L_ELBOW_Y/position
      - L_WRIST_P/position
      - L_WRIST_Y/position
      - L_WRIST_R/position
    reference_publish_rate: 50.0

right_arm_group_controller:
  ros__parameters:
    input_interfaces: [R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y, R_ELBOW_Y, R_WRIST_P, R_WRIST_Y, R_WRIST_R]
    output_interfaces:
      - R_SHOULDER_P/position
      - R_SHOULDER_R/position
      - R_SHOULDER_Y/position
      - R_ELBOW_Y/position
      - R_WRIST_P/position
      - R_WRIST_Y/position
      - R_WRIST_R/position
    reference_publish_rate: 50.0

waist_group_controller:
  ros__parameters:
    input_interfaces: [WAIST_Y, WAIST_R, WAIST_P]
    output_interfaces:
      - WAIST_Y/position
      - WAIST_R/position
      - WAIST_P/position
    reference_publish_rate: 50.0

head_group_controller:
  ros__parameters:
    input_interfaces: [NECK_Y, NECK_P, NECK_R]
    output_interfaces:
      - NECK_Y/position
      - NECK_P/position
      - NECK_R/position
    reference_publish_rate: 50.0

left_leg_group_controller:
  ros__parameters:
    input_interfaces: [L_HIP_P, L_HIP_R, L_HIP_Y, L_KNEE_P, L_ANKLE_P, L_ANKLE_R]
    output_interfaces:
      - L_HIP_P/position
      - L_HIP_R/position
      - L_HIP_Y/position
      - L_KNEE_P/position
      - L_ANKLE_P/position
      - L_ANKLE_R/position
    reference_publish_rate: 50.0

right_leg_group_controller:
  ros__parameters:
    input_interfaces: [R_HIP_P, R_HIP_R, R_HIP_Y, R_KNEE_P, R_ANKLE_P, R_ANKLE_R]
    output_interfaces:
      - R_HIP_P/position
      - R_HIP_R/position
      - R_HIP_Y/position
      - R_KNEE_P/position
      - R_ANKLE_P/position
      - R_ANKLE_R/position
    reference_publish_rate: 50.0
