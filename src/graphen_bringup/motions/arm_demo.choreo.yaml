# 編舞腳本範例：兩隻手臂的動作在時間上重疊。
#   右臂 0 ~ 3 s：A（下垂）→ B
#   左臂 1 ~ 5 s：C（下垂）→ D
# 格式見 graphen_choreographer/choreography.hpp；上機前先用
#   ros2 run graphen_choreographer choreo_check <這個檔案> --urdf <展開後的 URDF>
# 檢查範圍、峰值速度與建議的 max_steps。
#
# A / C 與 initial_positions.yaml 的手臂下垂姿態相同。
# TODO(verify-on-hw): B / D 只在 mock 與 MuJoCo 看過，實機上的方向與是否會碰撞尚未確認
version: 1
default_interp: quintic     # 兩端速度與加速度為 0

poses:
  r_arm_a: {R_SHOULDER_P: 0.0, R_SHOULDER_R: 1.3, R_SHOULDER_Y: 0.0, R_ELBOW_Y: 0.3,
            R_WRIST_P: 0.0, R_WRIST_Y: 0.0, R_WRIST_R: 0.0}
  r_arm_b: {R_SHOULDER_P: -0.6, R_SHOULDER_R: 1.2, R_SHOULDER_Y: 0.0, R_ELBOW_Y: 1.0,
            R_WRIST_P: 0.0, R_WRIST_Y: 0.0, R_WRIST_R: 0.0}
  l_arm_c: {L_SHOULDER_P: 0.0, L_SHOULDER_R: -1.3, L_SHOULDER_Y: 0.0, L_ELBOW_Y: -0.3,
            L_WRIST_P: 0.0, L_WRIST_Y: 0.0, L_WRIST_R: 0.0}
  l_arm_d: {L_SHOULDER_P: -0.6, L_SHOULDER_R: -1.2, L_SHOULDER_Y: 0.0, L_ELBOW_Y: -1.0,
            L_WRIST_P: 0.0, L_WRIST_Y: 0.0, L_WRIST_R: 0.0}

tracks:
  right_arm:
    joints: [R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y, R_ELBOW_Y, R_WRIST_P, R_WRIST_Y, R_WRIST_R]
    keyframes:
      # t: 0 的 keyframe 表示「必須已經在這個姿態」（差距超過 start_tolerance 時不執行）
      - {t: 0.0, pose: r_arm_a}
      - {t: 3.0, pose: r_arm_b}
  left_arm:
    joints: [L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y, L_ELBOW_Y, L_WRIST_P, L_WRIST_Y, L_WRIST_R]
    keyframes:
      - {t: 0.0, pose: l_arm_c}
      - {t: 1.0, hold: true}        # 停到 1 s 才開始動
      - {t: 5.0, pose: l_arm_d}
